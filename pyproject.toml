[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedsog-mef"
version = "0.1.0"
description = "Federated multi-expert fusion for cross-architecture binary code similarity using semantics-oriented graphs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7,<3",
    "transformers>=4.55,<5",
    "peft>=0.17,<0.18",
    "accelerate>=1.10,<2",
    "torchdata>=0.8",
    "tokenizers>=0.20",
    "safetensors>=0.4",
    "omegaconf>=2.3,<3",
    "pandas>=2.0,<3",
    "numpy>=1.26,<2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "tensorboard>=2.16",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "torch-geometric>=2.6,<2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llm4bin-train = "llm4bin.cli.train:main"
llm4bin-eval = "llm4bin.cli.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
